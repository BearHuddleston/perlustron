# SPDX-License-Identifier: MIT OR Apache-2.0

[package]
name = "perlustron"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Local-first agent-forensics workbench for Codex and Claude Code JSONL session logs"
readme = "README.md"
repository = "https://github.com/BearHuddleston/perlustron"
homepage = "https://github.com/BearHuddleston/perlustron"
keywords = ["codex", "claude", "jsonl", "forensics", "logs"]
categories = ["command-line-utilities", "development-tools::debugging"]

[dependencies]
anyhow = "1.0"
async-stream = "0.3"
axum = "0.8"
base64 = "0.22"
getrandom = "0.3"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "net", "time"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
