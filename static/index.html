<!doctype html>
<!-- SPDX-License-Identifier: MIT OR Apache-2.0 -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Perlustron</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/styles.css?v=110370804426795" />
  </head>
  <body>
    <main id="app">
      <header id="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true"></div>
          <strong>Perlustron</strong>
          <span class="version">v0.3.0</span>
          <span class="local-pill"><span></span>LOCAL</span>
        </div>
        <label class="search-box">
          <span aria-hidden="true"></span>
          <input id="search-input" type="search" value="" placeholder="Search metadata (sessions, turns, files, errors...)" aria-label="Search metadata" autocomplete="off" />
          <kbd>Ctrl K</kbd>
        </label>
        <div class="top-actions">
          <div id="source-switch" class="source-switch" aria-label="Session source">
            <button class="active" type="button" data-source="codex">Codex</button>
            <button type="button" data-source="claude">Claude</button>
          </div>
          <label class="session-picker">
            <span>Session</span>
            <select id="session-select" aria-label="Select session">
              <option value="">Loading sessions</option>
            </select>
            <small id="session-select-status">Loading</small>
          </label>
          <button id="live-toggle" class="live-select" type="button"><span></span><b id="live-state">LIVE</b> <small id="live-copy">Tailing session...</small></button>
          <button id="settings-button" class="settings" type="button">Settings</button>
        </div>
      </header>

      <nav id="mode-nav" class="mode-nav" aria-label="Default Perlustron modes">
        <button class="active" type="button" data-app-mode="summary">Summary</button>
        <button type="button" data-app-mode="map">Map</button>
        <button type="button" data-app-mode="timeline">Timeline</button>
        <button type="button" data-app-mode="transcript">Transcript</button>
        <label class="utility-mode-picker">
          <span>Utilities</span>
          <select id="utility-mode-select" class="mode-select" aria-label="Open utility view">
            <option value="">Open</option>
            <option value="health">Health</option>
            <option value="insights">Insights</option>
            <option value="diff">Diff</option>
            <option value="raw">Raw</option>
            <option value="export">Export</option>
            <option value="settings">Settings</option>
          </select>
        </label>
      </nav>

      <div id="workspace">
        <section id="stage">
          <div class="stage-header">
            <div class="stage-title-block">
              <h1 id="session-title">Loading session</h1>
            </div>
            <div class="stage-metrics">
              <strong id="stage-turn-count">0 turns</strong>
              <span id="stage-started">Started just now</span>
              <div class="context-pressure" title="Context pressure">
                <span>Context</span>
                <strong id="context-pressure-value">n/a</strong>
                <div id="context-pressure-bars" aria-hidden="true"></div>
              </div>
            </div>
            <div class="stage-roots" aria-label="Session roots">
              <div id="root-list" class="stage-root-list"></div>
            </div>
          </div>

          <div class="legend" aria-label="Metric filters">
            <span class="legend-item turn">Turn</span>
            <button type="button" data-metric="error"><span class="metric-dot error"></span>Errors <b id="metric-errors">0</b></button>
            <button type="button" data-metric="long"><span class="metric-dot long"></span>Long calls <b id="metric-long">0</b></button>
            <button type="button" data-metric="file"><span class="metric-dot file"></span>Files <b id="metric-files">0</b></button>
            <button type="button" data-metric="diff"><span class="metric-dot diff"></span>Diffs <b id="metric-diffs">0</b></button>
            <button type="button" data-metric="artifact"><span class="metric-dot artifact"></span>Artifacts <b id="metric-artifacts">0</b></button>
            <button type="button" data-metric="compaction"><span class="metric-dot compaction"></span>Compactions <b id="metric-compactions">0</b></button>
          </div>

          <div id="scene-frame">
            <canvas id="space" aria-label="Perlustron session workflow"></canvas>
            <section id="mode-panel" class="mode-panel hidden" aria-label="Selected Perlustron mode">
              <header>
                <div>
                  <span id="mode-panel-kicker">Mode</span>
                  <h2 id="mode-panel-title">Summary</h2>
                </div>
                <small id="mode-panel-summary">Waiting for session data</small>
              </header>
              <div id="mode-panel-filters" class="mode-filters">
                <label>
                  <span>Role</span>
                  <select id="mode-filter-role" aria-label="Filter timeline by role"></select>
                </label>
                <label>
                  <span>Type</span>
                  <select id="mode-filter-type" aria-label="Filter timeline by event type"></select>
                </label>
                <label>
                  <span>Tool</span>
                  <select id="mode-filter-tool" aria-label="Filter timeline by tool"></select>
                </label>
                <label>
                  <span>File</span>
                  <select id="mode-filter-file" aria-label="Filter timeline by file"></select>
                </label>
                <label><input id="mode-filter-errors" type="checkbox" /> Errors</label>
                <label><input id="mode-filter-unknown" type="checkbox" /> Unknown</label>
                <label><input id="mode-filter-malformed" type="checkbox" /> Malformed</label>
                <label><input id="mode-filter-redacted" type="checkbox" /> Redacted</label>
                <label><input id="mode-filter-utc" type="checkbox" /> UTC</label>
              </div>
              <div id="mode-panel-content" class="mode-panel-content"></div>
            </section>
            <div id="event-popup" class="event-popup hidden" role="dialog" aria-label="Event context">
              <div class="panel-heading">
                <div>
                  <span>Event Context</span>
                  <strong id="context-event-title">Latest context</strong>
                </div>
                <div class="event-popup-actions">
                  <button id="prev-event" type="button" title="Previous">&lt;</button>
                  <button id="next-event" type="button" title="Next">&gt;</button>
                  <button id="stream-minimize" type="button" title="Minimize context" aria-label="Collapse context">_</button>
                  <button id="stream-close" type="button" title="Clear selection">X</button>
                </div>
              </div>
              <div class="context-meta">
                <div>
                  <span>Kind</span>
                  <strong id="stream-kind">TURN</strong>
                </div>
                <div>
                  <span>Position</span>
                  <strong id="turn-number">Latest context</strong>
                </div>
                <div>
                  <span>Time</span>
                  <strong id="turn-timestamp">Live context</strong>
                </div>
              </div>
              <div class="event-context-actions" aria-label="Event evidence actions">
                <button id="stream-copy-ref" type="button">Copy Ref</button>
                <button id="stream-open-timeline" type="button">Timeline</button>
                <button id="stream-open-transcript" type="button">Transcript</button>
                <button id="stream-open-raw" type="button">Raw</button>
              </div>
              <div class="event-summary">
                <h2 id="stream-title">Select a turn</h2>
                <div id="stream-images" class="stream-images"></div>
                <pre id="stream-data">Click an object to inspect its live JSONL record.</pre>
              </div>
            </div>
            <div class="viewport-controls" aria-label="Viewport controls">
              <button type="button" data-view-action="zoom-in" aria-label="Zoom in" title="Zoom in">+</button>
              <button type="button" data-view-action="zoom-out" aria-label="Zoom out" title="Zoom out">-</button>
              <button type="button" data-view-action="two-d" aria-label="Switch to 2D overview" title="Switch to 2D overview">2D</button>
            </div>
            <button id="inspect-exit" class="inspect-exit" type="button" data-view-action="overview" title="Exit inspection">Exit inspection</button>
            <div class="live-chip"><span></span>LIVE</div>
          </div>
        </section>
      </div>

      <footer id="status-bar" aria-label="Session status">
        <span class="status-bar-label">Status</span>
        <div id="metadata-list" class="status-bar-items"></div>
      </footer>

    </main>
    <script type="module" src="/app-v110370804426795.js"></script>
  </body>
</html>
